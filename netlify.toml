[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The build cache keeps a snapshot of the environment; it is never served.
  # Everything else stays under the secrets scan.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The keeper of the judge's offline copies (public/sw.js): always asked
# fresh, so a fix reaches the tablets with the next page they open.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
